<svg width="100%" viewBox="0 0 680 532" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Screen 4 — health agent cross-checks the butter tteok against today's calorie budget</title>
<desc>Jarvis summons a health agent, pulls today's activity and remaining calorie budget, weighs the butter tteok against it, and composes healthier delivery alternatives while leaving the choice to the user.</desc>
<rect x="0" y="0" width="680" height="532" rx="14" fill="#F4F2EC"/>

<circle cx="32" cy="34" r="13" fill="#1f1e1c"/>
<text x="32" y="39" text-anchor="middle" font-size="14" fill="#fff">✦</text>
<text x="54" y="30" font-size="14" font-weight="600" fill="#1f1e1c">jarvis · 칼로리 확인</text>
<text x="54" y="48" font-size="12" fill="#6b6a64">건강 agent 소집 · 버터떡 맥락 유지중</text>
<rect x="576" y="22" width="82" height="24" rx="12" fill="none" stroke="#cfcdc4" stroke-width="0.5"/>
<text x="617" y="38" text-anchor="middle" font-size="11" fill="#8a8980">context kept</text>

<text x="20" y="74" font-size="11" fill="#8a8980"><tspan fill="#6b6a64">버터떡 주문 고민</tspan>  →  <tspan fill="#7C3AED" font-weight="600">건강 agent</tspan>  →  오늘 활동 + 떡 대조</text>

<!-- health surface -->
<rect x="16" y="86" width="648" height="240" rx="14" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<path d="M16 100 a14 14 0 0 1 14 -14 h620 a14 14 0 0 1 14 14 v20 h-648 z" fill="#7C3AED"/>
<text x="32" y="108" font-size="14" font-weight="700" fill="#ffffff">♥ Health</text>
<rect x="568" y="92" width="80" height="18" rx="9" fill="#ffffff" fill-opacity="0.22"/>
<text x="608" y="105" text-anchor="middle" font-size="10" fill="#fff">오늘 · 6월 14일</text>

<rect x="32" y="132" width="200" height="56" rx="10" fill="#F3EEFD"/>
<text x="46" y="150" font-size="11" fill="#5B21B6">소모</text>
<text x="46" y="170" font-size="17" font-weight="700" fill="#4C1D95">1,840</text>
<text x="46" y="183" font-size="10" fill="#7C3AED">kcal · 활동+기초</text>

<rect x="240" y="132" width="200" height="56" rx="10" fill="#F3EEFD"/>
<text x="254" y="150" font-size="11" fill="#5B21B6">섭취</text>
<text x="254" y="170" font-size="17" font-weight="700" fill="#4C1D95">1,260</text>
<text x="254" y="183" font-size="10" fill="#7C3AED">kcal · 아침+점심</text>

<rect x="448" y="132" width="200" height="56" rx="10" fill="#E8F8F7"/>
<text x="462" y="150" font-size="11" fill="#0a6e6a">남은 여유</text>
<text x="462" y="170" font-size="17" font-weight="700" fill="#0a4d4a">580</text>
<text x="462" y="183" font-size="10" fill="#0F6E56">kcal · 저녁용</text>

<rect x="32" y="200" width="616" height="50" rx="10" fill="#FAEEDA"/>
<rect x="44" y="210" width="30" height="30" rx="8" fill="#ffffff"/>
<text x="59" y="231" text-anchor="middle" font-size="16" fill="#BA7517">🍪</text>
<text x="86" y="222" font-size="13" font-weight="500" fill="#633806">버터떡 오리지널 (4구)</text>
<text x="86" y="238" font-size="11" fill="#854F0B">영상 1위 · 떡장인</text>
<text x="636" y="222" text-anchor="end" font-size="17" font-weight="700" fill="#633806">~620</text>
<text x="636" y="238" text-anchor="end" font-size="10" fill="#854F0B">kcal 추정</text>

<rect x="32" y="262" width="616" height="8" rx="4" fill="#eee"/>
<rect x="32" y="262" width="616" height="8" rx="4" fill="#E24B4A"/>
<rect x="32" y="262" width="576" height="8" rx="4" fill="#1D9E75"/>
<text x="32" y="290" font-size="11" fill="#A32D2D">⚠ 남은 580 kcal를 40 kcal 초과해요 (620 kcal)</text>

<!-- verdict callout -->
<rect x="16" y="338" width="648" height="46" rx="14" fill="#E6F1FB"/>
<text x="34" y="360" font-size="13" font-weight="500" fill="#185FA5">💡 살짝 초과지만, 선택지가 있어요</text>
<text x="34" y="376" font-size="11" fill="#185FA5" opacity="0.85">2구만 시키면 여유 안에 들어와요. 아니면 영상에 나온 더 가벼운 떡으로 바꿔도 좋아요 — 둘 다 지금 배달 가능.</text>

<!-- alternatives -->
<rect x="16" y="396" width="648" height="120" rx="14" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<text x="36" y="422" font-size="13" font-weight="500" fill="#1f1e1c">🌿 여유 안에 들어오는 선택지</text>

<rect x="36" y="434" width="42" height="42" rx="10" fill="#FAEEDA"/>
<text x="57" y="461" text-anchor="middle" font-size="20" fill="#BA7517">🍪</text>
<text x="92" y="448" font-size="13" font-weight="500" fill="#1f1e1c">버터떡 오리지널 (2구)</text>
<text x="92" y="464" font-size="11" fill="#0F6E56">~310 kcal · 여유 안에 들어옴 ✓</text>
<rect x="486" y="438" width="78" height="17" rx="8" fill="#E8F8F7"/>
<circle cx="498" cy="446" r="3" fill="#2AC1BC"/>
<text x="508" y="450" font-size="10" fill="#0a4d4a">배민 24분</text>
<text x="610" y="464" text-anchor="end" font-size="13" font-weight="700" fill="#1f1e1c">5,400원</text>
<circle cx="634" cy="455" r="14" fill="#1f1e1c"/>
<text x="634" y="460" text-anchor="middle" font-size="16" fill="#fff">+</text>
<line x1="36" y1="488" x2="648" y2="488" stroke="#eee" stroke-width="0.5"/>

<rect x="36" y="490" width="42" height="22" rx="6" fill="#E8F8F7"/>
<text x="57" y="506" text-anchor="middle" font-size="14" fill="#0F6E56">🥄</text>
<text x="92" y="500" font-size="13" font-weight="500" fill="#1f1e1c">현미 가래떡 구이 (4구)</text>
<text x="92" y="510" font-size="11" fill="#0F6E56">~280 kcal · 영상 추천 · 더 가벼움 ✓</text>
<rect x="470" y="492" width="94" height="17" rx="8" fill="#FBE5EE"/>
<circle cx="482" cy="500" r="3" fill="#D70F64"/>
<text x="492" y="504" font-size="10" fill="#8a0a40">쿠팡이츠 17분</text>
<text x="610" y="506" text-anchor="end" font-size="13" font-weight="700" fill="#1f1e1c">7,200원</text>
<circle cx="634" cy="499" r="14" fill="#1f1e1c"/>
<text x="634" y="504" text-anchor="middle" font-size="16" fill="#fff">+</text>
</svg>
