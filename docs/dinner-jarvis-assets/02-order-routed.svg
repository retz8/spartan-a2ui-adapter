<rect x="360" y="154" width="34" height="34" rx="8" fill="#FBE5EE"/>
<text x="377" y="177" text-anchor="middle" font-size="17" fill="#D70F64">🍕</text>
<text x="406" y="168" font-size="12" font-weight="500" fill="#222">페퍼로니 피자 L</text>
<text x="406" y="182" font-size="10" fill="#888">1개</text>
<text x="650" y="176" text-anchor="end" font-size="12" fill="#222">18,900원</text>
<rect x="360" y="194" width="34" height="34" rx="8" fill="#FBE5EE"/>
<text x="377" y="217" text-anchor="middle" font-size="17" fill="#D70F64">🥗</text>
<text x="406" y="208" font-size="12" font-weight="500" fill="#222">치킨 샐러드</text>
<text x="406" y="222" font-size="10" fill="#888">1개</text>
<text x="650" y="216" text-anchor="end" font-size="12" fill="#222">12,500원</text>
<line x1="360" y1="238" x2="648" y2="238" stroke="#eee" stroke-width="0.5"/>
<text x="360" y="256" font-size="11" fill="#666">배달비</text>
<text x="650" y="256" text-anchor="end" font-size="11" fill="#666">0원 (무료)</text>
<text x="360" y="274" font-size="13" font-weight="700" fill="#222">결제 완료</text>
<text x="650" y="274" text-anchor="end" font-size="13" font-weight="700" fill="#222">31,400원</text>
<text x="360" y="290" font-size="10" fill="#888">쿠페이 · 카카오페이</text>

<rect x="360" y="302" width="288" height="30" rx="9" fill="#FBE5EE"/>
<text x="376" y="321" font-size="12" font-weight="500" fill="#8a0a40">⚡ 단건배달 · 예상 도착 19분</text>
<rect x="360" y="340" width="288" height="32" rx="9" fill="#D70F64"/>
<text x="504" y="360" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">📍 배달 추적</text>
</g>

<!-- jarvis summary -->
<rect x="16" y="420" width="648" height="40" rx="12" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<circle cx="40" cy="440" r="13" fill="#E1F5EE"/>
<text x="40" y="445" text-anchor="middle" font-size="14" fill="#0F6E56">✓</text>
<text x="62" y="436" font-size="13" font-weight="500" fill="#1f1e1c">2개 brand 주문 모두 완료 — jarvis는 분배·합성만, 결제는 각 brand 안에서 처리</text>
<text x="62" y="451" font-size="11" fill="#6b6a64">총 43,900원 · 가장 빠른 도착 19분</text>
</svg>
