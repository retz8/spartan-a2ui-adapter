<svg width="100%" viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Screen 2 — order routed to brand agents, confirmations composed</title>
<desc>The unified cart is split and routed to Baemin and Coupang Eats agents, each processing its own payment, then the confirmations are composed back into one view.</desc>
<rect x="0" y="0" width="680" height="472" rx="14" fill="#F4F2EC"/>

<circle cx="32" cy="34" r="13" fill="#1f1e1c"/>
<text x="32" y="39" text-anchor="middle" font-size="14" fill="#fff">✦</text>
<text x="54" y="30" font-size="14" font-weight="600" fill="#1f1e1c">jarvis · 주문 완료</text>
<text x="54" y="48" font-size="12" fill="#6b6a64">2개 brand agent로 분배 · 각자 결제 처리됨</text>
<rect x="576" y="22" width="82" height="24" rx="12" fill="none" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="617" y="38" text-anchor="middle" font-size="11" fill="#0F6E56">✓ routed</text>

<text x="20" y="74" font-size="11" fill="#8a8980">통합 장바구니  →  <tspan fill="#2AC1BC" font-weight="600">배민 agent</tspan>  +  <tspan fill="#D70F64" font-weight="600">쿠팡이츠 agent</tspan>  →  각자 결제 · 배달</text>

<!-- Baemin confirmation -->
<g>
<rect x="16" y="86" width="320" height="324" rx="14" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<path d="M16 100 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v22 h-320 z" fill="#2AC1BC"/>
<text x="32" y="109" font-size="14" font-weight="700" fill="#0a4d4a">배달의민족</text>
<rect x="246" y="92" width="76" height="18" rx="9" fill="#ffffff" fill-opacity="0.45"/>
<text x="284" y="105" text-anchor="middle" font-size="10" fill="#0a4d4a">✓ 주문 접수</text>
<text x="32" y="144" font-size="11" fill="#0a6e6a">주문번호 B25-4471 · 우리분식</text>

<rect x="32" y="156" width="34" height="34" rx="8" fill="#E8F8F7"/>
<text x="49" y="179" text-anchor="middle" font-size="17" fill="#2AC1BC">🍲</text>
<text x="78" y="170" font-size="12" font-weight="500" fill="#222">김치찌개 정식</text>
<text x="78" y="184" font-size="10" fill="#888">1개</text>
<text x="322" y="178" text-anchor="end" font-size="12" fill="#222">9,500원</text>
<line x1="32" y1="206" x2="320" y2="206" stroke="#eee" stroke-width="0.5"/>
<text x="32" y="224" font-size="11" fill="#666">배달비</text>
<text x="322" y="224" text-anchor="end" font-size="11" fill="#666">3,000원</text>
<text x="32" y="244" font-size="13" font-weight="700" fill="#222">결제 완료</text>
<text x="322" y="244" text-anchor="end" font-size="13" font-weight="700" fill="#222">12,500원</text>
<text x="32" y="260" font-size="10" fill="#888">배민페이 · 신한카드 ****1234</text>

<rect x="32" y="276" width="288" height="34" rx="9" fill="#E8F8F7"/>
<text x="48" y="297" font-size="12" font-weight="500" fill="#0a4d4a">⏱ 예상 도착 28분 · 조리 시작됨</text>
<rect x="32" y="320" width="288" height="34" rx="9" fill="#2AC1BC"/>
<text x="176" y="341" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">📍 배달 추적</text>
</g>

<!-- Coupang Eats confirmation -->
<g>
<rect x="344" y="86" width="320" height="324" rx="14" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<path d="M344 100 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v22 h-320 z" fill="#D70F64"/>
