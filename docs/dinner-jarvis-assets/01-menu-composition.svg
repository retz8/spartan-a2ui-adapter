<text x="54" y="48" font-size="12" fill="#6b6a64">3개 배달 agent 합성 · 위치 서초구</text>
<rect x="566" y="22" width="92" height="24" rx="12" fill="none" stroke="#cfcdc4" stroke-width="0.5"/>
<text x="612" y="38" text-anchor="middle" font-size="11" fill="#8a8980">composed live</text>

<!-- Baemin card -->
<g>
