<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Screen 1 — three delivery agents composed into one menu view</title>
<desc>Jarvis summons Baemin, Coupang Eats, and Yogiyo agents and lays their menu surfaces side by side, each keeping its own brand color.</desc>
<rect x="0" y="0" width="680" height="470" rx="14" fill="#F4F2EC"/>

<circle cx="32" cy="34" r="13" fill="#1f1e1c"/>
