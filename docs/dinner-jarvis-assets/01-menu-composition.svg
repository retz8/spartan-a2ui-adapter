<text x="80" y="227" font-size="10" fill="#888">★ 4.7 (1,560)</text>
<text x="80" y="242" font-size="12" font-weight="700" fill="#222">11,000원</text>
<circle cx="200" cy="222" r="14" fill="#2AC1BC"/>
<text x="200" y="227" text-anchor="middle" font-size="16" fill="#fff">+</text>
