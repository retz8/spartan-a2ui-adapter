<text x="340" y="290" text-anchor="middle" font-size="11" fill="#8a8980">↑ 세 brand 메뉴 surface가 한 화면에 합성됨 — 각자 자기 색을 그대로 유지 (배민 민트 · 쿠팡이츠 마젠타 · 요기요 레드)</text>

<!-- unified cart -->
<rect x="16" y="312" width="648" height="124" rx="14" fill="#ffffff" stroke="#e5e3dc" stroke-width="0.5"/>
<text x="36" y="338" font-size="14" font-weight="500" fill="#1f1e1c">🛒 jarvis 통합 장바구니</text>
