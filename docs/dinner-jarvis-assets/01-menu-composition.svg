<text x="300" y="212" font-size="12" font-weight="500" fill="#222">치킨 샐러드</text>
<text x="300" y="227" font-size="10" fill="#888">★ 4.6 (412)</text>
<text x="300" y="242" font-size="12" font-weight="700" fill="#222">12,500원</text>
<rect x="406" y="208" width="28" height="28" rx="8" fill="#D70F64"/>
