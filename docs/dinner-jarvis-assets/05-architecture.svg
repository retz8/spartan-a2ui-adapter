<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>The architecture of one meal — jarvis composing across agents</title>
<desc>A structural diagram showing the user's wandering intent flowing through the super-agent, which summons delivery, YouTube, and health agents, composes their surfaces, and routes orders back to each brand.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="420" rx="14" fill="#F4F2EC"/>

<!-- user intent -->
<rect x="40" y="40" width="600" height="48" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="60" y="62" font-size="14" font-weight="500" fill="#2C2C2A">사용자의 두서없는 의도</text>
<text x="60" y="79" font-size="12" fill="#5F5E5A">"저녁 뭐 먹지" → "버터떡 후기 볼래" → "근데 칼로리…" → "주문해줘"</text>

<line x1="340" y1="88" x2="340" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- super agent -->
<rect x="220" y="116" width="240" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">jarvis (super-agent)</text>
<text x="340" y="158" text-anchor="middle" font-size="12" fill="#534AB7">소집 · 합성 · 라우팅</text>

<!-- three agents -->
<line x1="280" y1="172" x2="150" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="172" x2="340" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="172" x2="530" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="212" width="220" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">배달 agent ×3</text>
<text x="150" y="254" text-anchor="middle" font-size="11" fill="#0F6E56">배민 · 쿠팡이츠 · 요기요</text>
<text x="150" y="268" text-anchor="middle" font-size="11" fill="#0F6E56">메뉴 surface (각자 brand색)</text>

<rect x="270" y="212" width="140" height="64" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">유튜브 agent</text>
<text x="340" y="254" text-anchor="middle" font-size="11" fill="#A32D2D">후기 영상 surface</text>

<rect x="420" y="212" width="220" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="530" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">건강 agent</text>
<text x="530" y="254" text-anchor="middle" font-size="11" fill="#534AB7">오늘 활동 · 칼로리 여유</text>
<text x="530" y="268" text-anchor="middle" font-size="11" fill="#534AB7">(민감 데이터 · 권한 전제)</text>

<!-- composition note -->
<line x1="150" y1="276" x2="320" y2="312" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="340" y1="276" x2="340" y2="312" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="530" y1="276" x2="360" y2="312" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="160" y="312" width="360" height="44" rx="10" fill="#ffffff" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="332" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">한 화면에 합성 — 덮어쓰지 않고 배열만</text>
<text x="340" y="348" text-anchor="middle" font-size="11" fill="#5F5E5A">각 brand 스타일 보존 · cross-agent 판단(칼로리×배달) 생성</text>

<line x1="340" y1="356" x2="340" y2="380" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160" y="380" width="360" height="34" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="401" text-anchor="middle" font-size="12" fill="#085041">주문은 각 brand agent로 라우팅 — 결제·책임은 brand 안에 봉인</text>
</svg>
